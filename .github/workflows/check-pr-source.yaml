name: PR Source Branch Validator

on:
  pull_request:
    branches:
      - main

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch name
        run: |
          SOURCE_BRANCH=${{ github.head_ref }}
          echo "Analyzing source branch: $SOURCE_BRANCH"
          
          # Allow 'develop' or any branch starting with 'release/'
          if [[ "$SOURCE_BRANCH" == "develop" ]] || [[ "$SOURCE_BRANCH" =~ ^release/.* ]]; then
            echo "✅ Success: Pull Request source branch is valid."
            exit 0
          else
            echo "----------------------------------------------------------------"
            echo "❌ ERROR: Invalid source branch for Pull Request to 'main'."
            echo "Direct merges from '$SOURCE_BRANCH' are not allowed."
            echo "Only 'develop' or 'release/*' branches can be merged into 'main'."
            echo "----------------------------------------------------------------"
            exit 1
          fi
